<text x="106" y="674">Segurança</text><text x="106" y="714">da informação</text>
<text x="416" y="674">Privacidade</text><text x="416" y="714">e LGPD</text>
<text x="726" y="674">Ciber</text><text x="726" y="714">segurança</text>
