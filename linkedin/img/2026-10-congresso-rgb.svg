<g fill="#C2452D"><rect x="106" y="748" width="64" height="6" rx="3"/><rect x="416" y="748" width="64" height="6" rx="3"/><rect x="726" y="748" width="64" height="6" rx="3"/></g>
<g font-size="27" fill="#4A2A34">
<text x="106" y="808">Protege a</text><text x="106" y="852">informação de</text><text x="106" y="896">acesso indevido,</text><text x="106" y="940">perda e alteração.</text>
<text x="416" y="808">Cuida dos dados</text><text x="416" y="852">pessoais e dos</text><text x="416" y="896">direitos dos</text><text x="416" y="940">titulares.</text>
